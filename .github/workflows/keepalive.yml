name: keepalive

# GitHub disables scheduled workflows after 60 days with no repository activity.
# This weekly no-op commit-free job keeps the repo "active" so the hourly backup
# schedule never gets auto-disabled. It does nothing but touch the Actions log.

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "keepalive ping $(date -u) — backup schedule stays enabled"

# (registered with GitHub Actions)
